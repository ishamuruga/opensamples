apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config-map
data:
  mysql-server: food-card-api-mysql    # The name of mysql service
  mysql-database-name: mydb     # The name of the database used by the demo app
  mysql-user-username: user     # A new created user for the demo app 
  mysql-mount-path: /var/lib/mysql
  mysql-root-user: root
