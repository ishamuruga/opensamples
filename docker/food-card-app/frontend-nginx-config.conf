worker_processes 1;

events { worker_connections 1024; }

http {
    server {
        listen       8001;
        server_name  localhost;
        include /etc/nginx/mime.types;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            # try_files $uri $uri/ /index.html =404;
            proxy_pass http://food-card-api-service;
        }

    }
}


